# ==============================================================================
# Конфигурация сервиса автоматической смены кодов доступа BAS-IP AA14FB
# Структура объекта: 4 дома (в 1-м и 4-м по 3 двойных подъезда,
#                    во 2-м и 3-м по 6 двойных подъездов) + 2 калитки = всего 38 панелей
# ==============================================================================

# Вариант 1 (Рекомендуемый для детальной настройки IP/паролей каждой панели):
# Укажите файл со списком всех 38 панелей. В проекте уже подготовлены готовые шаблоны:
# - "panels.yaml" (удобный текстовый формат)
# - "panels.csv"  (можно открыть и редактировать в Excel / LibreOffice Calc)
panels_file: "panels.yaml"

# Вариант 2 (Автоматическая генерация, если все панели имеют единый пароль и IP по порядку):
facility_topology:
  use_default_38_panels: true  # Автоматически сгенерировать топологию из 38 панелей:
                               # - 2 Калитки (доступны ВСЕМ жильцам)
                               # - Дом 1: 3 двойных подъезда (6 панелей)
                               # - Дом 2: 6 двойных подъездов (12 панелей)
                               # - Дом 3: 6 двойных подъездов (12 панелей)
                               # - Дом 4: 3 двойных подъезда (6 панелей)
  base_ip_prefix: "192.168.1." # Базовая подсеть для панелей домофонов
  start_ip_suffix: 10          # Начальный IP (192.168.1.10 ... 192.168.1.47)
  default_port: 80
  default_username: "admin"
  default_password: "ВашПароль"

# Вариант 3: Список конкретных панелей непосредственно в конфиге:
basip_panels: []

# Интеграция с Google Таблицами
# Рекомендуется "google_apps_script", если Google Cloud Console заблокирован в вашей стране
google_sheets:
  backend_type: "google_apps_script"   # "google_apps_script", "appsheet", "google_sheets", или "local_csv"
  
  # URL веб-приложения из меню: Расширения -> Apps Script -> Развернуть -> Веб-приложение
  gas_web_app_url: "https://script.google.com/macros/s/ВАШ_SCRIPT_ID/exec"
  gas_api_key: ""                      # Опциональный ключ безопасности (если задан в Code.gs)
  worksheet_name: "Временные коды"     # Название вкладки в Google Таблице

  # Для AppSheet (если используется https://www.appsheet.com)
  appsheet_app_id: ""
  appsheet_access_key: ""
  appsheet_table_name: "Временные коды"

  # Для Google Cloud Console Service Account (если доступен GCP)
  credentials_json: "service_account.json"
  spreadsheet_id_or_title: "BAS-IP Access Codes"
  worksheet_name: "Коды доступа"

  csv_fallback_path: "users_access_codes.csv"

# Отправка писем через Google Mail (Gmail SMTP с Паролем приложений)
gmail:
  user: "your_building_intercom@gmail.com" # Почтовый ящик Gmail отправителя
  app_password: "xxxx yyyy zzzz wwww"       # Пароль приложения Google (16 символов без пробелов)
  from_name: "Домофон BAS-IP AA-14FB"       # Отображаемое имя отправителя
  subject: "Смена кода доступа домофона"    # Тема письма
  smtp_host: "smtp.gmail.com"
  smtp_port: 465
  use_ssl: true
  mock_email: false

# Параметры ротации кодов доступа
rotation:
  interval_days: 14            # Смена кодов раз в две недели (14 дней)
  code_length: 6               # Длина цифрового PIN-кода (от 4 до 8 цифр)
  avoid_trivial_codes: true    # Исключать тривиальные коды (123456, 111111, 654321 и т.д.)
  dry_run: false               # Режим симуляции (true - только показать, что изменится)
  schedule_time: "03:00"       # Время суток для автоматической ежедневной проверки (ЧЧ:ММ)
  check_interval_hours: 12     # Интервал проверки срока кодов (каждые N часов)

use_mock_panel: false
mock_panel_port: 18080
